asyncapi: 3.0.0
info:
  title: OneBridge Grid Events
  version: 1.0.0
components:
  schemas:
    DomainEvent:
      type: object
      required:
        - eventId
        - type
        - version
        - tenantId
        - occurredAt
        - correlationId
        - payload
        - aggregateVersion
      properties:
        eventId:
          type: string
        type:
          type: string
        version:
          type: string
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        payload:
          type: object
        aggregateVersion:
          type: integer
    UserRegisteredEvent:
      type: object
      required:
        - eventId
        - type
        - version
        - tenantId
        - occurredAt
        - correlationId
        - payload
        - aggregateVersion
      properties:
        eventId:
          type: string
        type:
          type: string
          const: "user.registered"
        version:
          type: string
          const: "1.0.0"
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        payload:
          type: object
          required:
            - userId
            - phone
            - authProvider
          properties:
            userId:
              type: string
            phone:
              type: string
            authProvider:
              type: string
              enum: [otp, google, microsoft]
        aggregateVersion:
          type: integer
    OrgCreatedEvent:
      type: object
      required:
        - eventId
        - type
        - version
        - tenantId
        - occurredAt
        - correlationId
        - payload
        - aggregateVersion
      properties:
        eventId:
          type: string
        type:
          type: string
          const: "org.created"
        version:
          type: string
          const: "1.0.0"
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        payload:
          type: object
          required:
            - orgId
            - businessId
            - creatorPersonId
            - name
            - slug
          properties:
            orgId:
              type: string
            businessId:
              type: string
              pattern: '^OB-[0-9A-HJKMNP-TV-Z]{6}$'
            creatorPersonId:
              type: string
            name:
              type: string
            slug:
              type: string
            plan:
              type: string
              description: starter or business (for the public company page catalogue limit)
            industry:
              type: string
            city:
              type: string
            website:
              type: string
        aggregateVersion:
          type: integer
    OrgUpdatedEvent:
      type: object
      required:
        - eventId
        - type
        - version
        - tenantId
        - occurredAt
        - correlationId
        - payload
        - aggregateVersion
      properties:
        eventId:
          type: string
        type:
          type: string
          const: "org.updated"
        version:
          type: string
          const: "1.0.0"
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        payload:
          type: object
          required:
            - orgId
            - businessId
          properties:
            orgId:
              type: string
            businessId:
              type: string
            updatedFields:
              type: object
        aggregateVersion:
          type: integer
    OrgBrandingUpdatedEvent:
      type: object
      required:
        - eventId
        - type
        - version
        - tenantId
        - occurredAt
        - correlationId
        - payload
        - aggregateVersion
      properties:
        eventId:
          type: string
        type:
          type: string
          const: "org.branding_updated"
        version:
          type: string
          const: "1.0.0"
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        payload:
          type: object
          required:
            - orgId
            - businessId
          properties:
            orgId:
              type: string
            businessId:
              type: string
            brandColours:
              type: object
              properties:
                primary:
                  type: string
                secondary:
                  type: string
                accent:
                  type: string
            logo:
              type: string
            cover:
              type: string
        aggregateVersion:
          type: integer
    BranchCreatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "branch.created" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, branchId, name]
          properties:
            orgId: { type: string }
            branchId: { type: string }
            name: { type: string }
            managerPersonId: { type: string }
            address: { type: string, description: "One-line postal address, for card Directions" }
            mapPin: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
        aggregateVersion: { type: integer }
    BranchUpdatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "branch.updated" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, branchId]
          properties:
            orgId: { type: string }
            branchId: { type: string }
            updatedFields: { type: object }
            name: { type: string }
            address: { type: string, description: "One-line postal address after the update" }
            mapPin: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
        aggregateVersion: { type: integer }
    BranchArchivedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "branch.archived" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, branchId]
          properties:
            orgId: { type: string }
            branchId: { type: string }
        aggregateVersion: { type: integer }
    DepartmentCreatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "department.created" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, departmentId, name]
          properties:
            orgId: { type: string }
            departmentId: { type: string }
            name: { type: string }
            branchId: { type: string }
        aggregateVersion: { type: integer }
    DepartmentUpdatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "department.updated" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, departmentId]
          properties:
            orgId: { type: string }
            departmentId: { type: string }
            updatedFields: { type: object }
        aggregateVersion: { type: integer }
    DepartmentArchivedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "department.archived" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, departmentId]
          properties:
            orgId: { type: string }
            departmentId: { type: string }
        aggregateVersion: { type: integer }
    TeamCreatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "team.created" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, teamId, name, departmentId]
          properties:
            orgId: { type: string }
            teamId: { type: string }
            name: { type: string }
            departmentId: { type: string }
            leadPersonId: { type: string }
        aggregateVersion: { type: integer }
    TeamUpdatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "team.updated" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, teamId]
          properties:
            orgId: { type: string }
            teamId: { type: string }
            updatedFields: { type: object }
        aggregateVersion: { type: integer }
    TeamDeletedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "team.deleted" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, teamId]
          properties:
            orgId: { type: string }
            teamId: { type: string }
        aggregateVersion: { type: integer }
    TeamArchivedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "team.archived" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, teamId]
          properties:
            orgId: { type: string }
            teamId: { type: string }
        aggregateVersion: { type: integer }
    OrgPersonMovedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "org.person_moved" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, personId]
          properties:
            orgId: { type: string }
            personId: { type: string }
            targetBranchId: { type: string }
            targetDepartmentId: { type: string }
            targetTeamId: { type: string }
        aggregateVersion: { type: integer }
    AuditRecordedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "audit.recorded" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [action, entityType, entityId, actorPersonId]
          properties:
            action: { type: string }
            entityType: { type: string }
            entityId: { type: string }
            actorPersonId: { type: string }
            actor: { type: string }
            ip: { type: string }
            before: { type: object }
            after: { type: object }
        aggregateVersion: { type: integer }
    SeatCreatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "seat.created" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, seatId, title, status]
          properties:
            orgId: { type: string }
            seatId: { type: string }
            title: { type: string }
            personId: { type: string }
            status: { type: string }
            branchId: { type: string }
            departmentId: { type: string }
            teamId: { type: string }
        aggregateVersion: { type: integer }
    SeatUpdatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "seat.updated" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, seatId]
          properties:
            orgId: { type: string }
            seatId: { type: string }
            updatedFields: { type: object }
        aggregateVersion: { type: integer }
    SeatAssignedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "seat.assigned" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, seatId, personId, bindingsPreserved]
          properties:
            orgId: { type: string }
            seatId: { type: string }
            previousPersonId: { type: string }
            personId: { type: string }
            bindingsPreserved: { type: boolean }
        aggregateVersion: { type: integer }
    SeatStatusChangedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "seat.status_changed" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, seatId, previousStatus, newStatus]
          properties:
            orgId: { type: string }
            seatId: { type: string }
            previousStatus: { type: string }
            newStatus: { type: string }
        aggregateVersion: { type: integer }
    OrgBrandingUpdatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "org.branding_updated" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, businessId, brandKit, fieldLocks]
          properties:
            orgId: { type: string }
            businessId: { type: string }
            brandKit: { type: object }
            fieldLocks: { type: object }
        aggregateVersion: { type: integer }
    CardPublishedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "card.published" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [cardId, tenantId, slug]
          properties:
            cardId: { type: string }
            tenantId: { type: string }
            slug: { type: string }
        aggregateVersion: { type: integer }
    CardApprovalRequestedEvent:
      description: F14 AC-4. An employee published a card in a company that requires approval; admins are notified (F22).
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "card.approval_requested" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [cardId, seatId, requestedBy]
          properties:
            cardId: { type: string }
            seatId: { type: string }
            requestedBy: { type: string, description: personId of the employee }
        aggregateVersion: { type: integer }
    KybStatusChangedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "kyb.status_changed" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [orgId, status]
          properties:
            orgId: { type: string }
            status: { type: string, enum: [pending, verified, rejected] }
        aggregateVersion: { type: integer }
    ShortLinkCreatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "shortlink.created" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [shortLinkId, code, targetType, targetId, destinationUrl, status]
          properties:
            shortLinkId: { type: string }
            code: { type: string }
            targetType: { type: string, enum: [card, company, branch, external] }
            targetId: { type: string }
            destinationUrl: { type: string }
            source: { type: string }
            status: { type: string, enum: [active, disabled, unactivated, pending_approval] }
        aggregateVersion: { type: integer }
    ShortLinkRepointedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "shortlink.repointed" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [shortLinkId, code, previousDestinationUrl, newDestinationUrl, repointedAt]
          properties:
            shortLinkId: { type: string }
            code: { type: string }
            previousDestinationUrl: { type: string }
            newDestinationUrl: { type: string }
            repointedAt: { type: string, format: date-time }
            repointedBy: { type: string }
        aggregateVersion: { type: integer }
    ShortLinkStatusChangedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "shortlink.status_changed" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [shortLinkId, code, previousStatus, newStatus]
          properties:
            shortLinkId: { type: string }
            code: { type: string }
            previousStatus: { type: string }
            newStatus: { type: string }
            reason: { type: string }
        aggregateVersion: { type: integer }
    SharebackSubmittedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "shareback.submitted" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [leadId, cardId, ownerSeatId, source, isDuplicate, consent]
          properties:
            leadId: { type: string }
            cardId: { type: string }
            ownerSeatId: { type: string }
            source: { type: string }
            sourceTag: { type: string }
            isDuplicate: { type: boolean }
            consent:
              type: object
              required: [timestamp, noticeVersion]
              properties:
                timestamp: { type: string, format: date-time }
                noticeVersion: { type: string }
        aggregateVersion: { type: integer }
    LeadCreatedEvent:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "lead.created" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [leadId, cardId, ownerSeatId, source, createdAt]
          properties:
            leadId: { type: string }
            cardId: { type: string }
            ownerSeatId: { type: string }
            source: { type: string }
            sourceTag: { type: string }
            createdAt: { type: string, format: date-time }
        aggregateVersion: { type: integer }
    MemberRegisteredEvent:
      description: "N01. A person created a member profile (IDs only)."
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "member.registered" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [personId]
          properties:
            personId: { type: string }
        aggregateVersion: { type: integer }
    MemberProfileUpdatedEvent:
      description: "N01. Field names that changed, never their values."
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "member.profile_updated" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [personId, changedFields]
          properties:
            personId: { type: string }
            changedFields: { type: array, items: { type: string } }
        aggregateVersion: { type: integer }
    MemberWorkHistoryChangedEvent:
      description: "N01. A verified (seat) or self-added entry changed."
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "member.work_history_changed" }
        version: { type: string, const: "1.0.0" }
        tenantId: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
        payload:
          type: object
          required: [personId, entryId, source]
          properties:
            personId: { type: string }
            entryId: { type: string }
            source: { type: string, enum: [seat, self] }
        aggregateVersion: { type: integer }
    OrgPlanChangedEvent:
      description: "N02. Includes moves to and from the free plan."
      type: object
      required: [eventId, type, version, tenantId, occurredAt, correlationId, payload, aggregateVersion]
      properties:
        eventId: { type: string }
        type: { type: string, const: "org.plan_changed" }
