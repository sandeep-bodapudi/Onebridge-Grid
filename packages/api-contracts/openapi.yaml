              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (insufficient role permissions or cross-tenant access)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Malware scan failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cards:
    get:
      summary: List card summaries for the caller's company (dashboard People, Cards and Audit views)
      description: One row per card, with the display name and public URL taken from the card itself, so the dashboard never shows raw seat or person IDs.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardSummary'
        '401':
          description: Missing or invalid access token

  /stats/overview:
    get:
      summary: Dashboard overview numbers (cards by status, views, saves, QR scans, leads)
      description: Views, saves and scans come from the buffered analytics events (Step 3); full analytics arrive in Step 8.
