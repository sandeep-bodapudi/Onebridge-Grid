                $ref: '#/components/schemas/ShortLink'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cards/{cardId}/qr/{qrId}:
    patch:
      summary: Repoint short link destination or update status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string }
        - in: path
          name: qrId
          required: true
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShortLinkRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortLink'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cards/{cardId}/qr/{qrId}.{format}:
    get:
      summary: Download branded QR code in specified format (PNG, SVG, PDF)
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string }
        - in: path
          name: qrId
          required: true
          schema: { type: string }
        - in: path
          name: format
          required: true
          schema: { type: string, enum: [png, svg, pdf] }
        - in: query
          name: size
          schema: { type: integer, default: 1000 }
      responses:
        '200':
          description: Branded QR image file
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/qr/standee:
    get:
      summary: Generate Company Standee print template (A4/A5)
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: template
          schema: { type: string, enum: [a4, a5], default: a4 }
        - in: query
          name: format
          schema: { type: string, enum: [pdf, svg], default: pdf }
      responses:
        '200':
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/branches/{branchId}/qr/standee:
    get:
      summary: Generate Branch Standee print template (A4/A5)
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: branchId
          required: true
          schema: { type: string }
        - in: query
          name: template
          schema: { type: string, enum: [a4, a5], default: a4 }
        - in: query
          name: format
          schema: { type: string, enum: [pdf, svg], default: pdf }
      responses:
        '200':
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
  /public/c/{slug}:
    get:
      summary: Retrieve public card view model for visitor page
      description: Returns published card details, company branding, branch location, and public sections. When inactive or unactivated, personal details are sanitized.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: "acme-steels/ob-01jd2x-e0001"
      responses:
        '200':
          description: Public card view model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCardResponse'
        '404':
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /public/c/{slug}/vcard:
    get:
      summary: Download contact as standard vCard (3.0 / 4.0)
      description: Returns a .vcf file with Content-Disposition attachment containing cardholder name, company, branch, title, phone, email, and photo URI.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: vCard file
          content:
            text/vcard:
              schema:
                type: string
        '404':
          description: Card not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /public/c/{slug}/shareback:
    post:
      summary: Submit visitor details via card share-back to create a lead
      description: Captures visitor contact details from public card share-back panel, encrypts PII per ADR-0002, enforces spam rate limits, and notifies card owner.
      operationId: submitShareback
      tags:
        - Public Cards
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Unique card slug or orgSlug/cardSlug
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [shareback, manual, company_enquiry, qr, nfc, link]
            default: shareback
          description: Capture channel
        - name: sourceTag
          in: query
          required: false
          schema:
            type: string
          description: Optional source tag (e.g. qr tag like 'booth-a' or 'standee')
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Client-provided idempotency key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharebackRequest'
      responses:
        '201':
          description: Lead successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharebackResponse'
        '200':
          description: Duplicate submission within 24 hours returning original confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharebackResponse'
        '400':
          description: Validation failure, invalid phone, or missing consent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Card not found or inactive
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded (per IP or per card)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
    AnalyticsEvent:
      type: object
      properties:
        eventType: { type: string }
        timestamp: { type: string, format: date-time }
        properties: { type: object }
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        deviceLabel: { type: string }
        ipAddress: { type: string }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
    Role:
      type: string
      enum:
        - super_admin
        - owner
        - admin
        - branch_manager
        - department_manager
        - team_lead
        - employee
        - viewer
    Scope:
      type: object
      properties:
        branchId: { type: string }
        departmentId: { type: string }
        teamId: { type: string }
    Membership:
      type: object
      required: [id, personId, orgId, role, createdAt]
      properties:
        id: { type: string }
