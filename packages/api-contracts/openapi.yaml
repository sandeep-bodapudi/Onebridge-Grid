          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cards/{cardId}:publish:
    post:
      summary: Publish a card; fires card.published and triggers web-public revalidation (F10 AC-6)
      security:
        - BearerAuth: []
      parameters:
        - in: path
