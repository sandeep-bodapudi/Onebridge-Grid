        cover: { type: string }
        brandColours: { $ref: '#/components/schemas/BrandColours' }
        industry: { type: string }
        size: { type: string }
        about: { type: string }
        website: { type: string }
        addresses: { type: array, items: { $ref: '#/components/schemas/Address' } }
        gstin: { type: string }
        socialLinks: { $ref: '#/components/schemas/SocialLinks' }
        slug: { type: string }
    Organization:
      type: object
      required: [id, businessId, name, slug, industry, size, city, plan, createdAt, updatedAt]
