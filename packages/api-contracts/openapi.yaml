  /company-profile:
    get:
      summary: Company page settings (F26) for the caller's company
      description: Catalogue, services, portfolio, client logos, documents, people directory, enquiry routing and the search-engine setting. Profile text (about, website, social links) lives on the organization (PATCH /orgs/{id}).
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileSettings'
    put:
      summary: Replace the company page settings (owners and admins)
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileSettings'
        '400':
          description: Invalid item (for example a video that is not YouTube or Vimeo, or a document over 25 MB)
        '403':
          description: Caller is not an owner or admin
        '422':
          description: Over the plan's catalogue limit (50 items on Starter)

  /public/o/{slug}:
