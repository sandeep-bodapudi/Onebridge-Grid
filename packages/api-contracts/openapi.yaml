        status: { type: string, enum: [active, archived], default: active }
        archivedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDepartmentRequest:
      type: object
      required: [name]
