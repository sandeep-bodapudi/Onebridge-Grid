      description: Owners and admins only. Returns 404 unless the DEMO_LEADS_PANEL flag is on. Full leads management is outside F13.
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
