                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Update a card's template, language or sections (F10 AC-2, AC-3)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
