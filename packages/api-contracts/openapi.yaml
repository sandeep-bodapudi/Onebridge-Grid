        - BearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewStats'

  /leads:
    get:
