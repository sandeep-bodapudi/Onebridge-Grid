        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
        - in: header
          name: X-Correlation-ID
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadLogoRequest'
