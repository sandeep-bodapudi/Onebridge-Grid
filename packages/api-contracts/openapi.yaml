          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
        - in: header
          name: X-Correlation-ID
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandKitRequest'
      responses:
        '200':
          description: Brand kit updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandKit'
        '400':
          description: Validation error or contrast failure below 4.5:1 without accepted auto-pick
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (insufficient role permissions or cross-tenant access)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Organization not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{id}/locks:
