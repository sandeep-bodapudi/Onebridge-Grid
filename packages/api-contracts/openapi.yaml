        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
