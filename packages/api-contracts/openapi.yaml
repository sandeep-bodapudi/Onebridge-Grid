      properties:
        title: { type: string }
        branchId: { type: string }
        departmentId: { type: string }
        teamId: { type: string }
        managerSeatId: { type: string }
        personId: { type: string }
        status:
          type: string
          enum: [vacant, invited, active, inactive]
        cardBinding:
          $ref: '#/components/schemas/SeatCardBinding'
    UpdateSeatRequest:
      type: object
      properties:
        title: { type: string }
        branchId: { type: string }
        departmentId: { type: string }
        teamId: { type: string }
        managerSeatId: { type: string }
        status:
          type: string
          enum: [vacant, invited, active, inactive, offboarded]
    AssignSeatRequest:
      type: object
      required: [personId]
      properties:
        personId: { type: string }
    PaginatedSeats:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CardTemplateId:
      type: string
      enum:
        - classic-charcoal
        - bridge-orange
        - arch-minimal
        - keystone-dark
        - paper-light
        - enterprise-blue
        - grid-mono
        - sand-warm
    CardTemplate:
      type: object
      required: [id, name, description]
      properties:
        id:
          $ref: '#/components/schemas/CardTemplateId'
        name: { type: string }
        description: { type: string }
    CardSectionType:
      type: string
      enum: [about, products, services, portfolio, gallery, documents, social_links, company_info, branch_map]
    CardSection:
      type: object
      required: [type, enabled, order, locked, visibility, content]
      properties:
        type:
          $ref: '#/components/schemas/CardSectionType'
        enabled: { type: boolean }
        order: { type: integer }
        locked: { type: boolean, description: "Admin-locked; rejected server-side if an employee edits it (F10 AC-3)" }
        visibility:
          type: string
          enum: [public, internal]
        content:
          type: object
          additionalProperties: true
    CatalogueItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        price: { type: string, maxLength: 40, description: Display price, e.g. "₹54,000 / MT" }
        priceOnRequest: { type: boolean }
        imageUrl: { type: string, format: uri }

    CompanyServiceItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }

    PortfolioItem:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 120 }
        client: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 800 }
        imageUrls: { type: array, maxItems: 8, items: { type: string, format: uri } }
        videoUrl: { type: string, format: uri, description: YouTube or Vimeo only }

    ClientLogo:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        imageUrl: { type: string, format: uri }

    CompanyDocument:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 120 }
        url: { type: string, format: uri, description: A PDF (https) }
        sizeBytes: { type: integer, maximum: 26214400 }

    CompanyProfileSettings:
      type: object
      required: [seoIndexable, products, services, portfolio, clientLogos, documents, directory, enquiryRouting]
      properties:
        seoIndexable: { type: boolean, description: Let search engines list the page }
        products: { type: array, items: { $ref: '#/components/schemas/CatalogueItem' } }
        services: { type: array, items: { $ref: '#/components/schemas/CompanyServiceItem' } }
        portfolio: { type: array, items: { $ref: '#/components/schemas/PortfolioItem' } }
        clientLogos: { type: array, items: { $ref: '#/components/schemas/ClientLogo' } }
        documents: { type: array, items: { $ref: '#/components/schemas/CompanyDocument' } }
        directory:
          type: object
          required: [enabled, seatIds]
          properties:
            enabled: { type: boolean }
            seatIds: { type: array, items: { type: string }, description: People shown; empty means every published card }
        enquiryRouting:
          type: object
          required: [branchSeats]
          properties:
            defaultSeatId: { type: string, description: Who receives general enquiries; defaults to the first published card }
            branchSeats: { type: object, additionalProperties: { type: string }, description: Branch ID to the seat that receives that branch's enquiries }
        limits:
          type: object
          readOnly: true
          properties:
            maxProducts: { type: integer, nullable: true, description: 50 on Starter, null for unlimited }

    PublicCompanyProfile:
      type: object
      required: [status, company, seoIndexable, branches, people, products, services, portfolio, clientLogos, documents]
      properties:
        status: { type: string, enum: [active, lapsed], description: A lapsed plan shows the basic profile only }
        company:
          type: object
          required: [name, slug, businessId, verifiedBadge]
          properties:
            id: { type: string, description: Opaque company ID (follow, chat and call targets, N04 and later) }
            name: { type: string }
            slug: { type: string }
            businessId: { type: string }
            verifiedBadge: { type: boolean }
            logo: { type: string }
            brandColours: { $ref: '#/components/schemas/BrandColours' }
            industry: { type: string }
            city: { type: string }
            about: { type: string }
            website: { type: string }
            gstin: { type: string }
            socialLinks: { $ref: '#/components/schemas/SocialLinks' }
        seoIndexable: { type: boolean }
        acceptsEnquiries: { type: boolean, description: False when nobody can receive an enquiry yet (no published card, or lapsed) }
        focusBranchId: { type: string }
        branches:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              address: { type: string }
              directionsUrl: { type: string }
        people:
          type: array
          items:
            type: object
            required: [name, designation, cardUrl]
            properties:
              name: { type: string }
              designation: { type: string }
              branchName: { type: string }
              photoUrl: { type: string }
              cardUrl: { type: string }
        products: { type: array, items: { $ref: '#/components/schemas/CatalogueItem' } }
        services: { type: array, items: { $ref: '#/components/schemas/CompanyServiceItem' } }
        portfolio: { type: array, items: { $ref: '#/components/schemas/PortfolioItem' } }
        clientLogos: { type: array, items: { $ref: '#/components/schemas/ClientLogo' } }
        documents:
          type: array
          items:
            type: object
            required: [id, title, downloadUrl]
            properties:
              id: { type: string }
              title: { type: string }
              sizeBytes: { type: integer }
              downloadUrl: { type: string }

    CompanyEnquiryRequest:
      type: object
      required: [name, phone, consent]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        company: { type: string }
        message: { type: string, maxLength: 1000 }
        productId: { type: string, description: Enquiry about this catalogue item }
        branchId: { type: string, description: Route to this branch's contact }
        consent: { type: boolean }
        turnstileToken: { type: string }

    InviteChannel:
      type: string
      enum: [sms, whatsapp, email]

    InviteRequest:
      type: object
      required: [channel, contact]
      properties:
        channel: { $ref: '#/components/schemas/InviteChannel' }
        contact: { type: string, description: Mobile number for sms and whatsapp, email address for email }

    InviteSummary:
      type: object
      required: [inviteId, seatId, channel, contactMasked, status, expiresAt, sentCount, lastSentAt]
      properties:
        inviteId: { type: string }
        seatId: { type: string }
        channel: { $ref: '#/components/schemas/InviteChannel' }
        contactMasked: { type: string, example: "+91 •••••• 3456" }
        status: { type: string, enum: [pending, claimed, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        sentCount: { type: integer }
        lastSentAt: { type: string, format: date-time }
        inviteUrl: { type: string, description: Only while invites are not delivered for real (fake notifier, never in production) }

    InvitePreview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, claimed, revoked, expired, invalid] }
        companyName: { type: string }
        companyLogo: { type: string }
        seatTitle: { type: string }
        channel: { $ref: '#/components/schemas/InviteChannel' }
        contactMasked: { type: string }
        expiresAt: { type: string, format: date-time }
        notice:
          type: object
          required: [version, en, hi]
          properties:
            version: { type: string }
            en:
              type: object
              required: [title, points, accept, decline]
              properties:
                title: { type: string }
                points: { type: array, items: { type: string } }
                accept: { type: string }
                decline: { type: string }
            hi:
              type: object
              required: [title, points, accept, decline]
              properties:
                title: { type: string }
                points: { type: array, items: { type: string } }
                accept: { type: string }
                decline: { type: string }

    ClaimInviteRequest:
      type: object
      required: [acceptNotice, noticeVersion]
      properties:
        acceptNotice: { type: boolean }
        noticeVersion: { type: string }

    ClaimInviteResponse:
      type: object
      required: [tenantId, seatId, cardId, companyName]
      properties:
        tenantId: { type: string }
        seatId: { type: string }
        cardId: { type: string }
        companyName: { type: string }

    CardSummary:
      type: object
      required: [id, slug, status, templateId, name, designation, publicUrl, updatedAt]
      properties:
        id: { type: string, description: Card ID (equals the seat ID) }
        seatId: { type: string }
        slug: { type: string }
        status: { type: string, enum: [draft, pending_approval, published, inactive] }
        templateId: { type: string }
        name: { type: string, description: Display name from the card's about section; empty if not filled in }
        designation: { type: string }
        publicUrl: { type: string, format: uri }
        updatedAt: { type: string, format: date-time }
        stats:
          $ref: '#/components/schemas/CardStats'

    CardStats:
      type: object
      description: Results for one card over the last 14 days (from the buffered analytics events, Step 3).
      required: [views, saves, leads, daily]
      properties:
        views: { type: integer }
        saves: { type: integer }
        leads: { type: integer }
        daily:
          type: array
          description: Card views per day, oldest first (14 entries)
          items: { type: integer }

    DailyCount:
      type: object
      required: [date, views, saves]
      properties:
        date: { type: string, format: date, description: Calendar day in UTC }
        views: { type: integer }
        saves: { type: integer }

    OverviewStats:
      type: object
      required: [cards, views, saves, qrScans, leads]
      properties:
        cards:
          type: object
          required: [total, published, draft, pendingApproval]
          properties:
            total: { type: integer }
            published: { type: integer }
            draft: { type: integer }
            pendingApproval: { type: integer }
        views: { type: integer }
        saves: { type: integer }
        qrScans: { type: integer }
        leads: { type: integer }
        period:
          type: object
          description: The last 14 days compared with the 14 days before.
          required: [days, views, saves, leads, previousViews, previousSaves, previousLeads]
          properties:
            days: { type: integer, example: 14 }
            views: { type: integer }
            saves: { type: integer }
            leads: { type: integer }
            previousViews: { type: integer }
            previousSaves: { type: integer }
            previousLeads: { type: integer }
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
        topCards:
          type: array
          description: Cards with the most views in the last 14 days (up to 5)
          items:
            type: object
            required: [id, name, designation, views]
            properties:
              id: { type: string }
              name: { type: string }
              designation: { type: string }
              views: { type: integer }

    LeadSummary:
      type: object
      required: [id, cardId, source, name, phone, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        ownerName: { type: string, description: Name on the card that received the lead }
        source: { type: string }
        sourceTag: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        company: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    Card:
      type: object
      required: [id, tenantId, ownerType, ownerId, slug, templateId, status, language, sections, verifiedBadge, approvalRequired, aggregateVersion, createdAt, updatedAt]
      properties:
        id: { type: string, example: "OB-7KQ2MX-E0001" }
        tenantId: { type: string }
        ownerType: { type: string, enum: [seat] }
        ownerId: { type: string }
        slug: { type: string, example: "acme-steels/sneha-r" }
        templateId:
          $ref: '#/components/schemas/CardTemplateId'
        status:
          type: string
          enum: [draft, pending_approval, published]
        language:
          type: string
          enum: [en, hi]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/CardSection'
        verifiedBadge: { type: boolean }
        approvalRequired: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        aggregateVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateCardRequest:
      type: object
      properties:
        templateId:
          $ref: '#/components/schemas/CardTemplateId'
        language:
          type: string
          enum: [en, hi]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/CardSection'
    BrandColoursKit:
      type: object
      required: [band, text]
      properties:
        band: { type: string, example: "#1B2A4A" }
        accent: { type: string, example: "#F68713" }
        text: { type: string, example: "#FFFFFF" }
    BrandKit:
      type: object
      required: [brandColours]
      properties:
        logo: { type: string, format: uri }
        brandColours: { $ref: '#/components/schemas/BrandColoursKit' }
        coverImage: { type: string, format: uri }
    UpdateBrandKitRequest:
      type: object
      required: [brandColours]
      properties:
        logo: { type: string, format: uri }
        brandColours: { $ref: '#/components/schemas/BrandColoursKit' }
        coverImage: { type: string, format: uri }
        acceptAutoPick:
          type: boolean
          default: false
          description: "When true, auto-picks charcoal (#393536) or paper (#FAF7F2) if text-on-band contrast is below 4.5:1"
    FieldLocks:
      type: object
      required: [lockedFields]
      properties:
        lockedFields:
          type: array
          items: { type: string }
          example: ["logo", "brandColours", "title", "departmentId", "branchId"]
    UpdateFieldLocksRequest:
      type: object
      required: [lockedFields]
      properties:
        lockedFields:
          type: array
          items: { type: string }
    UploadLogoRequest:
      type: object
      required: [filename, contentType, size, contentBase64]
      properties:
        filename: { type: string, example: "logo.png" }
        contentType: { type: string, enum: ["image/png", "image/svg+xml", "image/webp"] }
        size: { type: integer, example: 1048576 }
        contentBase64: { type: string }
    UploadLogoResponse:
      type: object
      required: [url, key, width, height]
      properties:
        url: { type: string, example: "https://cdn.onebridge.in/tenants/01JD2XORG/logos/logo.webp" }
        key: { type: string }
        width: { type: integer }
        height: { type: integer }
    ShortLinkResolution:
      type: object
      required: [code, destinationUrl, status, targetType, targetId]
      properties:
        code: { type: string }
        destinationUrl: { type: string }
        status: { type: string, enum: [active, disabled, unactivated, pending_approval] }
        targetType: { type: string, enum: [card, company, branch, external] }
        targetId: { type: string }
        tenantId: { type: string }
        source: { type: string }
    ShortLink:
      type: object
      required: [id, tenantId, code, targetType, targetId, destinationUrl, status, aggregateVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        code: { type: string }
        shortUrl: { type: string, example: "https://obg.in/x8Fk2LpQ" }
        targetType: { type: string, enum: [card, company, branch, external] }
        targetId: { type: string }
        destinationUrl: { type: string }
        source: { type: string }
        label: { type: string }
        status: { type: string, enum: [active, disabled, unactivated, pending_approval] }
        isExternal: { type: boolean }
        externalApprovedBy: { type: string, nullable: true }
        externalApprovedAt: { type: string, format: date-time, nullable: true }
        aggregateVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCardQrRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, example: "Expo 2026 standee" }
        label: { type: string, example: "Expo Standee Counter" }
        destinationUrl: { type: string, description: "Custom destination URL (OneBridge page by default; external requires Company Admin)" }
    UpdateShortLinkRequest:
      type: object
      properties:
        destinationUrl: { type: string }
        label: { type: string }
        status: { type: string, enum: [active, disabled] }
    PublicCardResponse:
      type: object
      required: [cardId, slug, status, templateId, language, verifiedBadge, company, sections, actions]
      properties:
        cardId:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [published, draft, pending_approval, inactive, unactivated, offboarded]
        templateId:
          type: string
          example: "classic-charcoal"
        language:
          type: string
          enum: [en, hi]
        verifiedBadge:
          type: boolean
        person:
          type: object
          description: "Omitted if card is inactive or unactivated (no personal data rule)"
          properties:
            name: { type: string }
            designation: { type: string }
            photoUrl: { type: string, format: uri }
            phone: { type: string }
            email: { type: string, format: email }
            bio: { type: string }
        company:
          type: object
          required: [id, businessId, name]
          properties:
            id: { type: string }
            businessId: { type: string }
            name: { type: string }
            logoUrl: { type: string, format: uri }
            brandColours:
              type: object
              properties:
                band: { type: string }
                accent: { type: string }
                text: { type: string }
        branch:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            address: { type: string }
            mapPin:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
        sections:
          type: array
          items:
            type: object
            required: [type, order, content]
            properties:
              type: { type: string }
              order: { type: integer }
              content:
                type: object
                additionalProperties: true
        actions:
          type: object
          required: [saveContactUrl]
          properties:
            saveContactUrl: { type: string }
            whatsappUrl: { type: string }
            callUrl: { type: string }
            emailUrl: { type: string }
            directionsUrl: { type: string }
        offboardedDetails:
          type: object
          properties:
            personName: { type: string }
            successorName: { type: string }
            successorMessageUrl: { type: string }
            redirectUrl: { type: string }
    SharebackRequest:
      type: object
      required:
        - name
        - phone
        - consent
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          description: 10-digit Indian phone or E.164 phone number
        email:
          type: string
          format: email
        company:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 500
        consent:
          type: boolean
          description: Explicit consent to share details with the card owner and company
        noticeVersion:
          type: string
          default: 'v1.0'
        turnstileToken:
          type: string
          description: Cloudflare Turnstile CAPTCHA response token
    SharebackResponse:
      type: object
      required:
        - leadId
        - cardId
        - status
        - message
        - createdAt
      properties:
        leadId:
          type: string
        cardId:
          type: string
        status:
          type: string
          enum: [created, duplicate]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


