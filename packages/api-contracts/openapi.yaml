        id: { type: string, description: "Opaque tenantId (ULID)" }
        businessId:
          type: string
          pattern: '^OB-[0-9A-HJKMNP-TV-Z]{6}$'
          example: "OB-7KQ2MX"
          description: "Permanent, immutable Base32 Business ID unique across the platform."
        name: { type: string }
        legalName: { type: string }
        slug: { type: string }
        previousSlugs: { type: array, items: { type: string } }
        industry: { type: string }
        size: { type: string }
        city: { type: string }
        about: { type: string }
        website: { type: string }
        addresses: { type: array, items: { $ref: '#/components/schemas/Address' } }
        gstin: { type: string }
        brandColours: { $ref: '#/components/schemas/BrandColours' }
        logo: { type: string }
        cover: { type: string }
        brandKit: { $ref: '#/components/schemas/BrandKit' }
        fieldLocks: { $ref: '#/components/schemas/FieldLocks' }
        socialLinks: { $ref: '#/components/schemas/SocialLinks' }
        plan: { type: string, enum: [free, starter, business] }
        verifiedBadge: { type: boolean, default: false }
        onboardingStartedAt: { type: string, format: date-time }
        firstCardCreatedAt: { type: string, format: date-time }
        timeToFirstCardSeconds: { type: integer }
        aggregateVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MapPin:
