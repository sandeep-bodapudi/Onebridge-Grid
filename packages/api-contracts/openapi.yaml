openapi: 3.1.0
info:
  title: OneBridge Grid API
  version: 1.0.0
paths:
  /auth/otp:
    post:
      summary: Request a one-time code by mobile, or by email (F14 invites sent by email)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Forwarded-For
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send phone, or email when signing in to claim an email invite.
              properties:
                phone: { type: string, example: "+919876543210" }
                email: { type: string, format: email }
      responses:
        '200':
          description: OTP dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "If registered, an OTP has been sent." }
                  cooldownSeconds: { type: integer, example: 30 }
        '429':
          description: Rate limit exceeded or locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/verify:
    post:
      summary: Verify OTP and initiate session
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              description: Send phone, or email for an email one-time code.
              properties:
                phone: { type: string, example: "+919876543210" }
                email: { type: string, format: email }
                code: { type: string, example: "123456" }
                deviceLabel: { type: string, example: "Chrome on macOS" }
      responses:
        '200':
          description: Login successful or MFA required
          headers:
            Set-Cookie:
              schema: { type: string, example: "refreshToken=...; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [authenticated, mfa_required, mfa_setup_required] }
                  accessToken: { type: string }
                  mfaTicket: { type: string }
        '400':
          description: Invalid code or challenge expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '423':
          description: Account or IP locked due to too many failed attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/oauth/{provider}:
    post:
      summary: Personal Google/Microsoft OpenID Connect login
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, microsoft] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                deviceLabel: { type: string }
      responses:
        '200':
          description: Authenticated, MFA required, or account link confirmation required
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [authenticated, mfa_required, mfa_setup_required, link_confirmation_required] }
                  accessToken: { type: string }
                  mfaTicket: { type: string }
                  linkTicket: { type: string }
                  maskedPhone: { type: string }
                  message: { type: string }
        '400':
          description: Invalid token or unverified identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/oauth/confirm-link:
    post:
      summary: Confirm OAuth account linking with primary credential OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkTicket, code]
              properties:
                linkTicket: { type: string }
                code: { type: string }
                deviceLabel: { type: string }
      responses:
        '200':
          description: OAuth account linked and user authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [authenticated, mfa_required, mfa_setup_required] }
                  accessToken: { type: string }
                  mfaTicket: { type: string }
        '400':
          description: Invalid ticket or code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/refresh:
    post:
      summary: Rotate refresh token and get new access token
      responses:
        '200':
          description: Token rotated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        '401':
          description: Invalid or revoked refresh token (family revoked)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      summary: Revoke current session and clear cookie
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }

  /auth/sessions:
    get:
      summary: List user's active sessions and devices
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated list of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionInfo'
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/sessions/{id}:
    delete:
      summary: Revoke specific session family
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Session revoked
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/mfa/setup:
    post:
      summary: Generate TOTP secret and QR payload for setup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaTicket: { type: string }
      responses:
        '200':
          description: TOTP configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qrUri: { type: string }

  /auth/mfa/verify:
    post:
      summary: Verify TOTP code to complete setup or authenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
                mfaTicket: { type: string }
      responses:
        '200':
          description: MFA passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /me:
    get:
      summary: Get authenticated person profile, memberships, active tenant, and effective permissions
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema: { type: string }
          description: Explicit active company ID
      responses:
        '200':
          description: Current identity context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - active tenant access denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /internal/memberships:
    post:
      summary: Internal membership creation/update (called by Org service or seeders)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, orgId, role]
              properties:
                personId: { type: string }
                orgId: { type: string }
                role:
                  type: string
                  enum: [super_admin, owner, admin, branch_manager, department_manager, team_lead, employee, viewer]
                branchId: { type: string }
                departmentId: { type: string }
                teamId: { type: string }
      responses:
        '201':
          description: Membership created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '422':
          description: Unprocessable request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /internal/memberships/role:
    get:
      summary: Caller's role in a company (service-to-service; D-SERVICE-AUTH)
      description: >
        Used by organization and cards to authorise a request after verifying
        the identity access token locally. Requires x-service-key; user tokens
        are rejected with 403.
      parameters:
        - in: header
          name: x-service-key
          required: true
          schema: { type: string }
        - in: query
          name: personId
          required: true
          schema: { type: string }
        - in: query
          name: tenantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The person's role in the company
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role:
                    type: string
                    enum: [super_admin, owner, admin, branch_manager, department_manager, team_lead, employee, viewer]
                  scope:
                    type: object
                    properties:
                      branchId: { type: string }
                      departmentId: { type: string }
                      teamId: { type: string }
        '400':
          description: personId or tenantId missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid service key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The person is not a member of the company
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/branches:
    get:
      summary: List Branches
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranches'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Create Branch
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Plan limit reached (Starter allows 1 branch) or forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/branches/{branchId}:
    get:
      summary: Get Branch
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: branchId
          required: true
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Update Branch
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: branchId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/branches/{branchId}/archive:
    post:
      summary: Archive Branch
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: branchId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/departments:
    get:
      summary: List Departments
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: branchId
          schema: { type: string }
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartments'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Create Department
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/departments/defaults:
    post:
      summary: Seed default departments (Sales, Marketing, HR, Support, Development)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartments'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/departments/{departmentId}:
    get:
      summary: Get Department
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: departmentId
          required: true
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Update Department
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: departmentId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/departments/{departmentId}/archive:
    post:
      summary: Archive Department
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: departmentId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/teams:
    get:
      summary: List Teams
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: query
          name: departmentId
          schema: { type: string }
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeams'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Create Team
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orgs/{tenantId}/teams/{teamId}:
    get:
      summary: Get Team
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: teamId
          required: true
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      summary: Update Team
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: teamId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
            $ref: '#/components/schemas/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      summary: Delete/Archive Team
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
        - in: path
          name: teamId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: header
          name: X-Tenant-Id
          schema: { type: string }
        - in: header
          name: X-User-Role
          schema:
