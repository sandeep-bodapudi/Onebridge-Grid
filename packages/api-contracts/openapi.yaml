        limit: { type: integer }
        offset: { type: integer }
    SeatCardBinding:
      type: object
      properties:
        cardId: { type: string }
        cardUrl: { type: string }
        qrCodeUrl: { type: string }
        nfcChipId: { type: string }
    Seat:
      type: object
      required: [id, tenantId, title, status, isReadOnly, createdAt, updatedAt]
      properties:
        id: { type: string, example: "OB-7KQ2MX-E0001" }
        tenantId: { type: string }
        title: { type: string, example: "Senior Account Executive" }
        branchId: { type: string, nullable: true }
        departmentId: { type: string, nullable: true }
        teamId: { type: string, nullable: true }
        managerSeatId: { type: string, nullable: true }
        personId: { type: string, nullable: true }
        status:
          type: string
          enum: [vacant, invited, active, inactive, offboarded]
        isReadOnly: { type: boolean, default: false }
        cardBinding:
          $ref: '#/components/schemas/SeatCardBinding'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSeatRequest:
      type: object
