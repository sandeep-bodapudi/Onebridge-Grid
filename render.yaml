# Hosted prototype as ONE Render web service (D-SINGLE-SERVICE). See docs/demo/hosting.md.
# The API, the admin app and the public site run behind one URL (scripts/single-server.mjs).
# Demo data only: fake OTP (code 123456) and an in-memory database re-seeded on every start.
# Never load real customers here.
services:
  - type: web
    name: onebridge-grid
    runtime: node
    plan: standard # three Node processes plus an in-memory MongoDB need more than 512 MB
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && node scripts/single-build.mjs
    startCommand: node scripts/single-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_ACCESS_PASSCODE
        sync: false # optional: passcode for the dashboard; the homepage, cards and company pages stay public
      - key: DEMO_RESET_KEY
        sync: false # optional: presenter key for POST /demo/reset
